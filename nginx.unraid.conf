worker_processes auto;
events {}
http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11;
    server_tokens off;
    server {
        listen 80;
        server_name gis.mybakedpotato.com 127.0.0.1 localhost;
        client_max_body_size 100G;
        client_body_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
        large_client_header_buffers 4 64k;
        gzip on;
        gzip_types text/css application/javascript application/json application/xml;
        location /static/ {
            alias /mnt/volumes/statics/static/;
            expires 30d;
        }
        location /uploaded/ {
            alias /mnt/volumes/statics/uploaded/;
        }
        location /geoserver {
            set $upstream geoserver:8080;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host gis.mybakedpotato.com;
            proxy_set_header X-Forwarded-Host gis.mybakedpotato.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header WWW-Authenticate;
            proxy_redirect http://$upstream https://gis.mybakedpotato.com;
            proxy_request_buffering off;
            client_max_body_size 0;
        }
        location / {
            set $upstream django:8000;
            proxy_pass http://$upstream;
            proxy_set_header Host gis.mybakedpotato.com;
            proxy_set_header X-Forwarded-Host gis.mybakedpotato.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
            proxy_request_buffering off;
        }
    }
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}
